<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Python Practice Playground</title>
<style>
  :root {
    --bg: #0e1420;
    --panel: #16202f;
    --panel-2: #1d2a3d;
    --line: #2b3a52;
    --ink: #e6edf7;
    --muted: #93a4bd;
    --accent: #5ac8fa;
    --ok: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    padding: 18px 24px 40px;
  }
  .sidebar {
    flex: 0 0 250px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    max-height: calc(100vh - 130px);
    overflow: auto;
  }
  .sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 7px;
    color: var(--ink);
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .sidebar button:hover { background: var(--panel-2); }
  .sidebar button.active { background: var(--accent); color: #06202e; font-weight: 600; }
  .sidebar button small {
    display: block;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 400;
  }
  .sidebar button.active small { color: #0b3346; }
  .main { flex: 1 1 auto; min-width: 0; display: grid; gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card > h2 {
    margin: 0;
    padding: 11px 16px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .card .body { padding: 16px; }
  pre {
    margin: 0;
    padding: 16px;
    overflow: auto;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre;
    color: #cfe3ff;
  }
  .fields { display: grid; gap: 10px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--ink);
    padding: 9px 11px;
    font: inherit;
    font-size: 14px;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .run {
    background: var(--accent);
    color: #06202e;
    border: 0;
    border-radius: 7px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .run:disabled { opacity: .6; cursor: progress; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .out {
    margin: 0;
    padding: 16px;
    min-height: 90px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .out.empty { color: var(--muted); }
  .stderr { color: var(--err); border-top: 1px solid var(--line); }
  .exit { color: var(--muted); border-top: 1px solid var(--line); font-size: 12.5px; }
  .exit.bad { color: var(--err); }
  @media (max-width: 780px) {
    .layout { flex-direction: column; padding: 14px; }
    .sidebar { flex: none; width: 100%; max-height: 260px; }
  }
</style>
</head>
<body>
<header>
  <h1>Python Practice Playground</h1>
  <p>Pick a script, answer what it asks for, and see what it prints.</p>
</header>

<div class="layout">
  <nav class="sidebar" id="list" aria-label="Scripts"></nav>

  <div class="main">
    <section class="card">
      <h2 id="source-title">Source</h2>
      <pre><code id="source">Loading…</code></pre>
    </section>

    <section class="card">
      <h2>Run it</h2>
      <div class="body">
        <div class="fields" id="fields"></div>
        <div class="actions">
          <button class="run" id="run" type="button">Run script</button>
          <span class="meta" id="hint"></span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Output</h2>
      <pre class="out empty" id="stdout">Run the script to see its output.</pre>
      <pre class="out stderr" id="stderr" hidden></pre>
      <div class="exit" id="exit" hidden></div>
    </section>
  </div>
</div>

<script>
const listEl = document.getElementById("list");
const sourceEl = document.getElementById("source");
const sourceTitle = document.getElementById("source-title");
const fieldsEl = document.getElementById("fields");
const runBtn = document.getElementById("run");
const hintEl = document.getElementById("hint");
const stdoutEl = document.getElementById("stdout");
const stderrEl = document.getElementById("stderr");
const exitEl = document.getElementById("exit");

let scripts = [];
let current = null;

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function select(script) {
  current = script;
  for (const btn of listEl.querySelectorAll("button")) {
    btn.classList.toggle("active", btn.dataset.name === script.name);
  }
  sourceTitle.textContent = script.name;
  sourceEl.innerHTML = escapeHtml(script.source);

  if (script.inputs === 0) {
    fieldsEl.innerHTML =
      '<p class="meta">This script doesn\'t ask for any input — just run it.</p>';
  } else {
    fieldsEl.innerHTML = Array.from({ length: script.inputs }, (_, i) => `
      <div class="field">
        <label for="in-${i}">Answer ${i + 1}</label>
        <input id="in-${i}" data-index="${i}" autocomplete="off" placeholder="Type an answer…" />
      </div>
    `).join("");
  }

  hintEl.textContent = script.inputs === 1
    ? "This script asks for 1 answer."
    : `This script asks for ${script.inputs} answers.`;

  stdoutEl.textContent = "Run the script to see its output.";
  stdoutEl.classList.add("empty");
  stderrEl.hidden = true;
  exitEl.hidden = true;
}

async function run() {
  if (!current) return;
  const answers = [...fieldsEl.querySelectorAll("input")]
    .map((el) => el.value);

  runBtn.disabled = true;
  runBtn.textContent = "Running…";
  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name: current.name, inputs: answers }),
    });
    const data = await res.json();

    if (data.error) {
      stdoutEl.textContent = data.error;
      stdoutEl.classList.add("empty");
      stderrEl.hidden = true;
      exitEl.hidden = true;
      return;
    }

    stdoutEl.textContent = data.stdout || "(no output)";
    stdoutEl.classList.toggle("empty", !data.stdout);

    if (data.stderr) {
      stderrEl.textContent = data.stderr;
      stderrEl.hidden = false;
    } else {
      stderrEl.hidden = true;
    }

    exitEl.hidden = false;
    exitEl.className = "exit";
    if (data.timed_out) {
      exitEl.textContent = "Stopped after 10s — the script was still waiting for input.";
      exitEl.classList.add("bad");
    } else if (data.returncode !== 0) {
      exitEl.textContent = `Exited with code ${data.returncode}.`;
      exitEl.classList.add("bad");
    } else {
      exitEl.textContent = "Finished successfully (exit code 0).";
    }
  } catch (err) {
    stdoutEl.textContent = "Could not reach the runner: " + err.message;
    stdoutEl.classList.add("empty");
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = "Run script";
  }
}

runBtn.addEventListener("click", run);
fieldsEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") run();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
});

fetch("/api/scripts")
  .then((r) => r.json())
  .then((data) => {
    scripts = data;
    listEl.innerHTML = scripts.map((s) => `
      <button type="button" data-name="${escapeHtml(s.name)}">
        ${escapeHtml(s.name)}
        <small>${s.inputs === 0 ? "no input" : s.inputs + " answer" + (s.inputs > 1 ? "s" : "")}</small>
      </button>
    `).join("");
    for (const btn of listEl.querySelectorAll("button")) {
      btn.addEventListener("click", () => {
        select(scripts.find((s) => s.name === btn.dataset.name));
      });
    }
    if (scripts.length) select(scripts[0]);
  })
  .catch(() => {
    listEl.innerHTML = '<p class="meta">Could not load the script list.</p>';
  });
</script>
</body>
</html>
